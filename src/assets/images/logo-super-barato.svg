<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Super más barato">
  <defs>
    <!-- Disco principal: gradiente diagonal cálido (ámbar → naranja → rojo) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Brillo superior (gloss) -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Disco principal con sombra -->
  <g filter="url(#soft)">
    <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>
    <circle cx="100" cy="100" r="96" fill="url(#shine)"/>
  </g>

  <!-- Hilos de velocidad (eco del original) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="34" y1="78" x2="58" y2="78"/>
    <line x1="28" y1="92" x2="54" y2="92"/>
    <line x1="32" y1="106" x2="58" y2="106"/>
  </g>

  <!-- Carrito de la compra (limpio, geométrico) -->
  <g transform="translate(60 86)">
    <!-- Asa -->
    <path d="M 8 6 L 22 6 L 28 22"
          fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cesta -->
    <path d="M 22 22 L 84 22 L 78 56 L 28 56 Z"
          fill="#ffffff"/>

    <!-- Rejilla de la cesta -->
    <g stroke="#dc2626" stroke-width="2.5" stroke-linecap="round">
      <line x1="34" y1="32" x2="34" y2="52"/>
      <line x1="46" y1="32" x2="46" y2="52"/>
      <line x1="58" y1="32" x2="58" y2="52"/>
      <line x1="70" y1="32" x2="70" y2="52"/>
    </g>

    <!-- Ruedas -->
    <circle cx="38" cy="68" r="6" fill="#ffffff"/>
    <circle cx="38" cy="68" r="2.5" fill="#dc2626"/>
    <circle cx="70" cy="68" r="6" fill="#ffffff"/>
    <circle cx="70" cy="68" r="2.5" fill="#dc2626"/>

    <!-- Línea inferior de la cesta -->
    <line x1="22" y1="22" x2="84" y2="22" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Banda diagonal "SUPER" -->
  <g transform="rotate(-12 100 100)">
    <rect x="22" y="44" width="156" height="22" rx="11" fill="#ffffff"/>
    <text x="100" y="60"
          font-family="'Inter', system-ui, sans-serif"
          font-size="18" font-weight="800"
          fill="#dc2626"
          text-anchor="middle"
          letter-spacing="1">SUPER</text>
  </g>

  <!-- Badge "BARATO" en la esquina inferior derecha -->
  <g transform="rotate(18 130 152)">
    <rect x="86" y="138" width="88" height="24" rx="12" fill="#dc2626"/>
    <text x="130" y="154"
          font-family="'Inter', system-ui, sans-serif"
          font-size="13" font-weight="800"
          fill="#ffffff"
          text-anchor="middle"
          letter-spacing="0.5">BARATO</text>
  </g>
</svg>
