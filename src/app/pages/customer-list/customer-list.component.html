<div>
  <header class="customer-header">
    <span class="customer-icon" aria-hidden="true">
      <fa-icon [icon]="faListCheck" size="lg"></fa-icon>
    </span>
    <h2 class="customer-title">Mi lista de la compra</h2>
    <p class="customer-subtitle">
      * Los precios pueden ser diferentes si ha transcurrido mucho tiempo
      desde que se guardó en tu lista.
    </p>
  </header>

  <div class="container-products">
    @if (!!((products$ | async) ?? []).length) {
      <h3 class="results-title">Mis supermercados</h3>
    }

    <app-supermarket-view
      [externalProducts]="(products$ | async) ?? []"
      [supermarkets]="supermarkets"
      [isStickyMarket]="false"
    ></app-supermarket-view>

    @if (!((products$ | async) ?? []).length) {
      <div class="empty-state">
        <span class="empty-state__icon" aria-hidden="true">
          <fa-icon [icon]="faCartShopping" size="lg"></fa-icon>
        </span>
        <p>Añade desde la pestaña de Precios tus productos favoritos.</p>
      </div>
    }
  </div>
</div>
