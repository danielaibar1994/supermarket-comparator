<div
  class="home-container"
  [class.empty-data]="!externalProducts.length"
  [class.sticky-active-offset]="isSticky"
>
  <header class="header-container">
    <div class="header-logo-wrap">
      <img src="../../../assets/images/carro2.png" alt="Logo Super más barato" />
    </div>

    <h2 class="header-title">Comparador de precios</h2>
    <h3 class="header-subtitle">entre los supermercados más habituales.</h3>
  </header>

  <div class="search-container" [class.is-sticky]="isSticky">
    <div class="search-input-wrap">
      <input
        #searchInput
        type="text"
        autocapitalize="none"
        class="search-input"
        [(ngModel)]="inputSearch"
        (input)="onSearchQueryInputKeyUp($event)"
        (keyup.enter)="onSearchQueryInput($event)"
        placeholder="Busque su producto: leche, lentejas…"
      />

      @if (inputSearch) {
        <button
          type="button"
          class="search-clear-btn"
          aria-label="Limpiar búsqueda"
          (click)="clearInput()"
        >
          &times;
        </button>
      }

      <button
        type="button"
        class="search-icon-btn"
        aria-label="Buscar"
        (click)="onSearchQueryInput()"
      >
        <fa-icon [icon]="faSearch"></fa-icon>
      </button>
    </div>
  </div>

  <app-footer
    [supermarketsSelected]="supermarketsSelected"
    (supermarketChange)="clickSupermarket($event)"
    (bulkSelectionChange)="onBulkSelection($event)"
  ></app-footer>

  <div class="container-products">
    @if (!empty) {
      <div class="container-types">
        <h2 class="results-title">Resultados</h2>

        <div class="types-buttons">
          <span
            class="type-button"
            [class.selectedType]="filterByType === 'SUPERMARKET'"
            (click)="setType('SUPERMARKET')"
          >
            Supermercados
          </span>
          <span
            class="type-button"
            [class.selectedType]="filterByType === 'PRICE'"
            (click)="setType('PRICE')"
          >
            Más barato
          </span>
        </div>
      </div>
    }

    @if (filterByType === 'SUPERMARKET') {
      <app-supermarket-view
        [externalProducts]="externalProducts"
        [supermarkets]="supermarkets"
      ></app-supermarket-view>
    }

    @if (filterByType === 'PRICE') {
      <app-price-comparator
        [externalProducts]="externalProducts"
      ></app-price-comparator>
    }

    <div class="copyright-container">
      <span>{{ year }} · Super más barato · Desarrollada por Daniel Aibar</span>
    </div>
  </div>
</div>
