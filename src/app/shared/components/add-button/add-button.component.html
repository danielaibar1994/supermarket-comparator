<button
  type="button"
  class="add-button"
  [class.selected]="isAdded"
  (click)="addProductInStore()"
  [attr.aria-label]="isAdded ? 'Quitar de mi lista' : 'Añadir a mi lista'"
  [attr.aria-pressed]="isAdded"
  [title]="isAdded ? 'Quitar de mi lista' : 'Añadir a mi lista'"
>
  <span aria-hidden="true">{{ isAdded ? '−' : '+' }}</span>
</button>
