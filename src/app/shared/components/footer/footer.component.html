<div class="footer">
  <p class="footer-title">Selecciona tus supermercados</p>

  <div class="brand-chips">
    @for (market of SUPERMARKETS_LIST; track market) {
      <button
        type="button"
        class="chip"
        [class.chip--off]="!supermarketsSelected[market.name.toString()]"
        [attr.aria-pressed]="supermarketsSelected[market.name.toString()]"
        (click)="clickSupermarket(market.name)"
      >
        <img [src]="market.icon" [alt]="market.name" />
        <span>{{ market.name }}</span>
      </button>
    }
  </div>

  <div class="brand-chips">
    @for (market of SUPERMARKETS_LIST_SECOND; track market) {
      <button
        type="button"
        class="chip"
        [class.chip--off]="!supermarketsSelected[market.name.toString()]"
        [attr.aria-pressed]="supermarketsSelected[market.name.toString()]"
        (click)="clickSupermarket(market.name)"
      >
        <img [src]="market.icon" [alt]="market.name" />
        <span>{{ market.name }}</span>
      </button>
    }
  </div>

  <div class="brand-chips">
    @for (market of SUPERMARKETS_LIST_THIRD; track market) {
      <button
        type="button"
        class="chip"
        [class.chip--off]="!supermarketsSelected[market.name.toString()]"
        [attr.aria-pressed]="supermarketsSelected[market.name.toString()]"
        (click)="clickSupermarket(market.name)"
      >
        <img [src]="market.icon" [alt]="market.name" />
        <span>{{ market.name }}</span>
      </button>
    }
  </div>

  @if (supermarketsSelected['gadis']) {
    <p class="footer-note">* Gadis puede demorar la visualización de la lista.</p>
  }
</div>
