@if (visible()) {
  <div
    class="cookie-banner"
    [class.cookie-banner--left]="position() === 'bottom-left'"
    role="dialog"
    aria-live="polite"
    aria-label="Aviso de cookies"
  >
    <div class="cookie-banner__inner">
      <div class="cookie-banner__content">
        <strong class="cookie-banner__title">🍪 Esta web usa cookies</strong>
        <p class="cookie-banner__text">
          Usamos cookies propias y de terceros (Google AdSense) para analizar el
          uso de la aplicación y mostrar anuncios personalizados. Puedes
          aceptarlas, rechazarlas o consultar la
          <a routerLink="/privacy" class="cookie-banner__link"
            >política de privacidad</a
          >
          y la
          <a routerLink="/cookies" class="cookie-banner__link"
            >política de cookies</a
          >.
        </p>
      </div>

      <div class="cookie-banner__actions">
        <button
          type="button"
          class="cookie-banner__btn cookie-banner__btn--ghost"
          (click)="reject()"
        >
          Rechazar
        </button>
        <button
          type="button"
          class="cookie-banner__btn cookie-banner__btn--primary"
          (click)="accept()"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>
}
